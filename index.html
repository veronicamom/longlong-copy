      color-scheme: light dark;

      --page-secondary: #f2f2f7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: #1c1c1e;
        --page-text: #f2f2f7;
        --page-hint: #98989d;
        --page-button: #2ea6ff;
        --page-button-text: #ffffff;
        --page-secondary: #2c2c2e;
      }
    }

    * { box-sizing: border-box; }

    html {
      background: var(--tg-theme-bg-color, var(--page-bg));
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      background: var(--tg-theme-bg-color, var(--page-bg));
      color: var(--tg-theme-text-color, var(--page-text));
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }

    main {
      width: min(640px, 100%);
      margin: 0 auto;
      padding:
        calc(16px + env(safe-area-inset-top))
        calc(16px + env(safe-area-inset-right))
        calc(16px + env(safe-area-inset-bottom))
        calc(16px + env(safe-area-inset-left));
    }

    h1 {
      margin: 4px 0 6px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .hint {
      margin: 0 0 14px;
      color: var(--tg-theme-hint-color, var(--page-hint));
      font-size: 14px;
      line-height: 1.45;
    }

    .status,
    textarea {
      width: 100%;
      margin: 0;
      border: 0;
      border-radius: 14px;
      background: var(--tg-theme-secondary-bg-color, var(--page-secondary));
      color: inherit;
    }

    .status {

      min-height: 12rem;
      color: var(--tg-theme-hint-color, var(--page-hint));
      font-size: 16px;
      line-height: 1.55;

      resize: none;
      padding: 16px;
      min-height: 12rem;
      overflow: auto;
      font: inherit;
      font-size: 18px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
      caret-color: transparent;
    }

    textarea:focus {
      outline: 2px solid var(--tg-theme-button-color, var(--page-button));
      outline-offset: 2px;
    }

    ::selection {
      background: var(--tg-theme-button-color, var(--page-button));
      color: var(--tg-theme-button-text-color, var(--page-button-text));
    }

    .footer { margin-top: 12px; }

    html[data-mode="view"] .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      width: min(640px, 100%);
      margin: 0 auto;
      padding:
        8px
        calc(16px + env(safe-area-inset-right))
        calc(8px + env(safe-area-inset-bottom))
        calc(16px + env(safe-area-inset-left));
      background: var(--tg-theme-bg-color, var(--page-bg));
    }

      padding-bottom: calc(92px + env(safe-area-inset-bottom));

      display: flex;
      gap: 8px;

      border: 0;
      border-radius: 12px;
      padding: 14px 12px;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;

    .actions > button { flex: 1; }

    #view { margin: 0 0 12px; }

    .card {
      margin: 0 0 12px;
      padding: 14px;
      border-radius: 14px;
      background: var(--tg-theme-secondary-bg-color, var(--page-secondary));
    }

    .kicker {
      margin: 0 0 8px;
      color: var(--tg-theme-hint-color, var(--page-hint));
      font-size: 13px;
      font-weight: 600;
    }

    .link-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }

    .link-copy {
      min-width: 0;
      flex: 1 1 12rem;
    }

    .link-label {
      color: var(--tg-theme-link-color, var(--page-button));
      font-weight: 600;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .link-domain {
      margin: 2px 0 0;
      color: var(--tg-theme-hint-color, var(--page-hint));
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .row-actions,

      display: flex;
      gap: 8px;
      align-items: center;

    .card > .row-actions {
      flex-wrap: wrap;

      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;

    .bullets {
      margin: 6px 0 0;

    .bullets li { margin: 2px 0; }

    .map {
      display: block;

      height: 180px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      background: var(--tg-theme-bg-color, var(--page-bg));

    .mini {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 14px;
      background: var(--tg-theme-button-color, var(--page-button));
      color: var(--tg-theme-button-text-color, var(--page-button-text));

    .mini.ghost {

      color: var(--tg-theme-link-color, var(--page-button));

    #copy {

      color: var(--tg-theme-button-text-color, var(--page-button-text));

    #close {

      ta.style.height = 'auto';
      var top = ta.getBoundingClientRect().top;
      var actionsH = actions ? actions.offsetHeight : 0;
      var available = window.innerHeight - top - actionsH - 28;
      var floor = document.documentElement.dataset.mode === 'view' ? 140 : 220;
      if (available < floor) available = floor;
      var next = ta.scrollHeight;
      if (next < floor) next = floor;
      if (next > available) next = available;
      ta.style.height = next + 'px';
    }

    function clearNode(node) {
      if (!node) return;
      while (node.firstChild) node.removeChild(node.firstChild);
    }

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function miniButton(label, copyValue, ghost) {
      var btn = el('button', ghost ? 'mini ghost' : 'mini', label);
      btn.type = 'button';
      if (copyValue != null) btn.setAttribute('data-copy', copyValue);
      return btn;
    }

    function linkLabel(link) {
      if (link.title) return link.title;
      return domainLabel(link.url) || link.url;
    }

    function renderLink(link) {
      var row = el('div', 'link-row');
      var copy = el('div', 'link-copy');
      var anchor = el('a', 'link-label', linkLabel(link));
      anchor.href = link.url;
      anchor.target = '_blank';
      anchor.rel = 'noopener noreferrer';
      anchor.setAttribute('data-open', link.url);
      copy.appendChild(anchor);
      var domain = domainLabel(link.url);
      if (domain && domain !== linkLabel(link)) copy.appendChild(el('p', 'link-domain', domain));
      row.appendChild(copy);
      var actions = el('div', 'row-actions');
      var open = miniButton('열기');
      open.setAttribute('data-open', link.url);
      actions.appendChild(open);
      actions.appendChild(miniButton('복사', link.url, true));
      row.appendChild(actions);
      return row;
    }

    function renderPlace(place) {
      var card = el('section', 'card');
      card.appendChild(el('p', 'kicker', '장소'));
      if (place.name) card.appendChild(el('p', 'place-name', place.name));
      if (place.address) card.appendChild(el('p', 'address', place.address));
      if (place.lat != null && place.lng != null) {
        var src = osmEmbed(place.lat, place.lng);
        if (src) {
          var frame = document.createElement('iframe');
          frame.className = 'map';
          frame.src = src;
          frame.loading = 'lazy';
          frame.referrerPolicy = 'no-referrer';
          frame.title = place.name || '지도';
          card.appendChild(frame);
        }
      }
      var actions = el('div', 'row-actions');
      if (place.mapUrl) {
        var open = miniButton('지도 열기');
        open.setAttribute('data-open', place.mapUrl);
        actions.appendChild(open);
      }
      if (place.address) actions.appendChild(miniButton('주소 복사', place.address, true));
      if (actions.firstChild) card.appendChild(actions);
      return card;
    }

    function renderSection(section) {
      var plain = sectionPlain(section);
      if (!plain) return null;
      var card = el('section', 'card section');
      var head = el('div', 'section-head');
      if (section.heading) head.appendChild(el('h3', '', section.heading));
      head.appendChild(miniButton('복사', plain, true));
      card.appendChild(head);
      var blocks = section.blocks || [];
      for (var i = 0; i < blocks.length; i++) {
        var block = blocks[i];
        if (block.type === 'ul') {
          var list = el('ul', 'bullets');
          for (var j = 0; j < block.items.length; j++) list.appendChild(el('li', '', block.items[j]));
          card.appendChild(list);
        } else {
          card.appendChild(el('p', 'para', block.text));
        }
      }
      return card;
    }

    function renderView(view) {
      var root = document.getElementById('view');
      clearNode(root);
      if (!root || !view) {
        if (root) root.hidden = true;
        return;
      }
      var i;
      if (view.links.length) {
        var links = el('section', 'card');
        links.appendChild(el('p', 'kicker', '링크'));
        for (i = 0; i < view.links.length; i++) links.appendChild(renderLink(view.links[i]));
        root.appendChild(links);
      }
      for (i = 0; i < view.places.length; i++) root.appendChild(renderPlace(view.places[i]));
      if (view.sectioned) {
        for (i = 0; i < view.sections.length; i++) {
          var card = renderSection(view.sections[i]);
          if (card) root.appendChild(card);
        }
      }
      root.hidden = !root.firstChild;
    }

    function setTitle(text) {
      var title = document.getElementById('title');
      var next = text || '복사하기';
      if (title) title.textContent = next;
      document.title = next;
    }

    function applyResult(result) {
      var textarea = document.getElementById('text');
      var status = document.getElementById('status');
      var hint = document.getElementById('hint');
      var copyBtn = document.getElementById('copy');
      var root = document.documentElement;
      root.dataset.state = result.state;
      if (result.reason) root.dataset.reason = result.reason;
      else delete root.dataset.reason;

      if (result.state === 'ready') {
        var payload = result.view;
        var show = !!(payload && payload.show);
        var sectioned = !!(show && payload.sectioned);
        textarea.value = result.text || '';
        textarea.hidden = !textarea.value || sectioned;
        setTitle(show && payload.title ? payload.title : '');
        renderView(show ? payload : null);
        status.hidden = true;
        status.textContent = '';
        hint.hidden = false;
        hint.textContent = sectioned
          ? '글을 길게 눌러 원하는 부분만 선택할 수 있어요.'
          : '길게 눌러 원하는 부분만 선택한 뒤 복사하세요.';
        copyBtn.disabled = !textarea.value;
        root.dataset.mode = show ? 'view' : 'plain';
        fitTextarea();
        return;
      }

      textarea.value = '';
      textarea.hidden = true;
      setTitle('');
      renderView(null);
      delete root.dataset.mode;
      hint.hidden = true;
      status.hidden = false;
      status.textContent = result.state === 'error'
        ? (MESSAGES[result.reason] || MESSAGES.format)
        : MESSAGES.empty;
      copyBtn.disabled = true;
    }

    function render() {
      var seq = ++renderSeq;
      var toast = document.getElementById('toast');
      if (toast) {
        toast.classList.remove('show');
        toast.textContent = '';
      }
      document.documentElement.dataset.state = 'loading';
      delete document.documentElement.dataset.reason;
      LonglongCopy.decodeHash(capturedFragment).then(function (result) {
        if (seq !== renderSeq) return;
        applyResult(result);
      });
    }

    function showToast(message) {
      var toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.remove('show');
      }, 4000);
    }

    function copyHelper() {
      var helper = document.getElementById('copy-helper');
      if (helper) return helper;
      helper = document.createElement('textarea');
      helper.id = 'copy-helper';
      helper.tabIndex = -1;
      helper.readOnly = true;
      helper.style.position = 'fixed';
      helper.style.top = '0';
      helper.style.left = '0';
      helper.style.width = '1px';
      helper.style.height = '1px';
      helper.style.opacity = '0';
      document.body.appendChild(helper);
      return helper;
    }

    function fallbackCopy(text) {
      var ta = document.getElementById('text');
      var useVisible = ta && !ta.hidden && ta.value === text;
      var node = useVisible ? ta : copyHelper();
      var start = useVisible ? ta.selectionStart : 0;
      var end = useVisible ? ta.selectionEnd : 0;
      var scroll = useVisible ? ta.scrollTop : 0;
      var ok = false;
      node.value = text;
      try {
        node.focus();
        node.setSelectionRange(0, text.length);
        ok = document.execCommand('copy');
      } catch (e) {
        ok = false;
      }
      if (useVisible) {
        try {
          ta.setSelectionRange(start, end);
          ta.scrollTop = scroll;
        } catch (e) {}
      } else {
        try { node.blur(); } catch (e) {}
      }
      return ok;
    }

    function copyText(text) {
      if (!text) return;
      var clipboard = navigator.clipboard;
      var canClipboard = !!(clipboard && typeof clipboard.writeText === 'function' && window.isSecureContext);
      // execCommand has to run inside the click. A clipboard permission
      // prompt can leave writeText pending, so the sync copy is what
      // makes the toast show immediately. writeText still runs when it
      // exists, which is what Telegram's webview actually grants.
      var syncOk = fallbackCopy(text);
      if (!canClipboard) {
        showToast(syncOk ? '복사됐어요' : '복사하지 못했어요');
        return;
      }
      var settled = false;
      function finish(ok) {
        if (settled) return;
        settled = true;
        showToast(ok ? '복사됐어요' : '복사하지 못했어요');
      }
      if (syncOk) finish(true);
      var timer = setTimeout(function () { finish(syncOk); }, 700);
      clipboard.writeText(text).then(function () {
        clearTimeout(timer);
        finish(true);
      }, function () {
        clearTimeout(timer);
        finish(syncOk);
      });
    }

    function copyAll() {
      copyText(document.getElementById('text').value);
    }

    function openExternal(url, event, fromAnchor) {
      var safe = safeHttpUrl(url);
      if (!safe) return;
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && typeof tg.openLink === 'function') {
        if (event) event.preventDefault();
        try {
          tg.openLink(safe);
          return;
        } catch (e) {}
      }
      if (fromAnchor) return;
      if (event) event.preventDefault();
      window.open(safe, '_blank', 'noopener,noreferrer');
    }

    function onViewClick(event) {
      var target = event.target;
      if (!target || !target.closest) return;
      var opener = target.closest('[data-open]');
      if (opener) {
        openExternal(opener.getAttribute('data-open'), event, opener.tagName === 'A');
        return;
      }
      var copier = target.closest('[data-copy]');
      if (!copier) return;
      event.preventDefault();
      copyText(copier.getAttribute('data-copy') || '');
      try { copier.focus(); } catch (e) {}
    }

    function closeApp() {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && typeof tg.close === 'function') tg.close();
    }

    function applyTheme() {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg || !tg.themeParams) return;
      var map = {
        bg_color: '--tg-theme-bg-color',
        text_color: '--tg-theme-text-color',
        hint_color: '--tg-theme-hint-color',
        link_color: '--tg-theme-link-color',
        button_color: '--tg-theme-button-color',
        button_text_color: '--tg-theme-button-text-color',
        secondary_bg_color: '--tg-theme-secondary-bg-color',
        header_bg_color: '--tg-theme-header-bg-color',
        accent_text_color: '--tg-theme-accent-text-color',
        section_bg_color: '--tg-theme-section-bg-color',
        section_header_text_color: '--tg-theme-section-header-text-color',
        subtitle_text_color: '--tg-theme-subtitle-text-color',
        destructive_text_color: '--tg-theme-destructive-text-color'
      };
      var rootStyle = document.documentElement.style;
      var params = tg.themeParams;
      for (var key in map) {
        if (Object.prototype.hasOwnProperty.call(params, key) && params[key]) {
          rootStyle.setProperty(map[key], params[key]);
        }
      }
      if (params.bg_color) {
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', params.bg_color);
      }
      if (tg.colorScheme === 'dark' || tg.colorScheme === 'light') {
        document.documentElement.style.colorScheme = tg.colorScheme;
      }
    }

    function tgVersionAtLeast(tg, need) {
      var current = String(tg.version || '0').split('.');
      var target = String(need).split('.');
      var len = Math.max(current.length, target.length);
      for (var i = 0; i < len; i++) {
        var a = parseInt(current[i] || '0', 10);
        var b = parseInt(target[i] || '0', 10);
        if (isNaN(a)) a = 0;
        if (isNaN(b)) b = 0;
        if (a > b) return true;
        if (a < b) return false;
      }
      return true;
    }

    function bootTelegram() {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;
      applyTheme();
      try { tg.ready(); } catch (e) {}
      try { tg.expand(); } catch (e) {}
      // These methods warn on the version 6.0 stub used outside Telegram.
      if (typeof tg.disableVerticalSwipes === 'function' && tgVersionAtLeast(tg, '7.7')) {
        try { tg.disableVerticalSwipes(); } catch (e) {}
      }
      if (tgVersionAtLeast(tg, '6.1')) {
        if (typeof tg.setHeaderColor === 'function') {
          try { tg.setHeaderColor('bg_color'); } catch (e) {}
        }
        if (typeof tg.setBackgroundColor === 'function') {
          try { tg.setBackgroundColor('bg_color'); } catch (e) {}
        }
      }
      if (typeof tg.onEvent === 'function') tg.onEvent('themeChanged', applyTheme);
    }

    function onHashChange() {
      try { capturedFragment = takeFragmentFromLocation(); } catch (e) { capturedFragment = ''; }
      render();
    }

    function init() {
      if (booted || !document.getElementById('text')) return;
      booted = true;
      document.getElementById('copy').addEventListener('click', copyAll);
      document.getElementById('close').addEventListener('click', closeApp);
      var view = document.getElementById('view');
      if (view) view.addEventListener('click', onViewClick);
      window.addEventListener('hashchange', onHashChange);
      window.addEventListener('resize', fitTextarea);
      render();
      bootTelegram();
    }
  </script>
</head>
<body>
  <main>
    <h1 id="title">복사하기</h1>
    <p id="hint" class="hint" hidden>길게 눌러 원하는 부분만 선택한 뒤 복사하세요.</p>
    <p id="status" class="status" hidden></p>
    <div id="view" hidden></div>
    <label class="sr-only" for="text">복사할 내용</label>
    <textarea id="text" rows="8" readonly spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" translate="no" wrap="soft" hidden></textarea>
    <div class="footer">
      <div class="actions">
        <button type="button" id="copy" disabled>전체 복사</button>
        <button type="button" id="close">닫기</button>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
  </main>
  <noscript><p>이 페이지는 자바스크립트가 필요해요.</p></noscript>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>init();</script>
</body>
</html>
